[package]
name = "rkat-tui"
description = "Interactive terminal coding harness on the Meerkat agent platform, with an auto-mode approval model"
version = "0.0.1"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["Martin Bruse"]
repository = "https://github.com/zond/rkat-tui"
keywords = ["agent", "llm", "tui", "coding"]
categories = ["command-line-utilities"]
# Development-only files stay out of the published crate: a registry build
# reads neither the checkout's cargo config nor its toolchain pin.
exclude = [".github/", ".cargo/", "rust-toolchain.toml", "CLAUDE.md", "deny.toml"]

[lib]
name = "rkat_tui"
path = "src/lib.rs"

[[bin]]
name = "rkat-tui"
path = "src/main.rs"

# Experimental: the mob daemon (see docs/mob-split.md).
[[bin]]
name = "rkat-tui-mob"
path = "src/bin/rkat-tui-mob.rs"

[workspace]

[dependencies]
# Meerkat engine: the runtime-backed persistent session path (SQLite realm
# store, auto-compaction), skills, MCP, comms and semantic memory
# (`meerkat-memory` directly for the start-up index probe).
#
# One crates.io release for every `meerkat-*` line; 0.9.13 carries every
# engine fix the application needs. Moving the version on every line is the
# pin move.
meerkat = { version = "0.9.13", features = ["anthropic", "openai", "gemini", "session-store", "jsonl-store", "session-compaction", "memory-store-session", "skills", "comms", "mcp", "schedule"] }
meerkat-core = { version = "0.9.13" }
meerkat-runtime = { version = "0.9.13", features = ["sqlite-store"] }
meerkat-store = { version = "0.9.13" }
meerkat-sqlite = { version = "0.9.13" }
# `sqlite`: the session task store the Ctrl+T checklist reads.
meerkat-tools = { version = "0.9.13", features = ["sqlite"] }
meerkat-models = { version = "0.9.13" }
meerkat-llm-core = { version = "0.9.13" }
meerkat-memory = { version = "0.9.13" }
meerkat-sandbox = { version = "0.9.13" }
meerkat-schedule = { version = "0.9.13" }
meerkat-mob = { version = "0.9.13" }
meerkat-mob-mcp = { version = "0.9.13" }
# The user skills directory: listed and counted by the engine's own
# filesystem skill source (`bootstrap::skills`).
meerkat-skills = { version = "0.9.13" }
# The `rkat-tui-mob` daemon serves Meerkat's own JSON-RPC method router
# (`MethodRouter`, `RpcServer`, `SessionRuntime`) over loopback TCP. Default
# features off: no realtime voice and no governed-realm host.
meerkat-rpc = { version = "0.9.13", default-features = false, features = ["mob", "mcp", "comms", "schedule"] }
# The attach client (`rkat-tui --attach`) reads the daemon's replies with the
# engine's own wire types (`events/list_since`, `events/snapshot`).
meerkat-contracts = { version = "0.9.13" }

# Async + serialization
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
toml = "0.9"
schemars = { version = "1", features = ["derive"] }

# Infra
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Durable digests (allow cache, trust record) and atomic file writes.
sha2 = "0.10"
# The attach handshake's proofs (the token never travels).
hmac = "0.12"
tempfile = "3.14"
# A council's mob id, derived as the engine derives it (`mobs::council`).
uuid = { version = "1", features = ["v5"] }
# Task update stamps (the checklist orders by them).
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Terminal UI
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

# File tools and path policy
ignore = "0.4"
globset = "0.4"
notify = "8"
regex = "1"
similar = "2"

# Ctrl+Z: stop the process with SIGTSTP (job control).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs", "user", "hostname"] }

[features]
# Makes the internal modules public and adds `harness` (the headless
# runner) for this crate's own integration tests. Not a stable API.
test-support = []

[dev-dependencies]
# The integration tests drive the internal modules through `test-support`.
rkat-tui = { path = ".", features = ["test-support"] }
tokio = { version = "1.43", features = ["full", "test-util", "macros"] }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# ── Lint groups (pedantic is the main "paranoid" level) ──────────────
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# ── Hard denies (these are bugs, not style) ─────────────────────────
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
mutex_integer = "deny"
mutex_atomic = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "allow"
print_stderr = "allow"

# ── Pedantic allows (noisy or inapplicable) ─────────────────────────
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
return_self_not_must_use = "allow"
manual_string_new = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
missing_fields_in_debug = "allow"
unreadable_literal = "allow"
float_cmp = "allow"
single_match_else = "allow"
similar_names = "allow"
doc_markdown = "allow"
match_bool = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
needless_pass_by_value = "allow"
needless_continue = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
struct_field_names = "allow"
doc_link_with_quotes = "allow"
missing_const_for_fn = "allow"
default_trait_access = "allow"
let_underscore_untyped = "allow"
allow_attributes_without_reason = "allow"
ignore_without_reason = "allow"
manual_let_else = "allow"
unused_async = "allow"
assigning_clones = "allow"
format_push_string = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
map_unwrap_or = "allow"
case_sensitive_file_extension_comparisons = "allow"
ref_option = "allow"
items_after_test_module = "allow"
large_futures = "allow"
large_enum_variant = "allow"
redundant_closure_for_method_calls = "allow"
question_mark = "allow"
type_complexity = "allow"
# Cargo
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
redundant_feature_names = "allow"

