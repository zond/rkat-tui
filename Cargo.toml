[package]
name = "rkat-tui"
description = "Interactive terminal coding harness on the Meerkat agent platform, with an auto-mode approval model"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["Martin Bruse"]
repository = "https://github.com/zond/rkat-tui"
keywords = ["agent", "llm", "tui", "coding"]
categories = ["command-line-utilities"]

[lib]
name = "rkat_tui"
path = "src/lib.rs"

[[bin]]
name = "rkat-tui"
path = "src/main.rs"

[workspace]

[dependencies]
# Meerkat engine: the runtime-backed persistent session path (SQLite realm
# store, auto-compaction), skills, MCP, comms and semantic memory
# (`meerkat-memory` directly for the start-up index probe).
#
# Pinned to the zond/meerkat fork at upstream main c89d1ccc6e plus the three
# engine fixes the harness needs (Anthropic thinking-block binding, implicit
# mob provider for configured non-catalog models, final-symlink read-only
# file grant). Upstream is re-landing them for 0.9.11; switch to crates.io
# then and drop the `mobs/customizer` hook.
meerkat = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2", features = ["anthropic", "openai", "gemini", "session-store", "jsonl-store", "session-compaction", "memory-store-session", "skills", "comms"] }
meerkat-core = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2" }
meerkat-runtime = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2", features = ["sqlite-store"] }
meerkat-store = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2" }
meerkat-sqlite = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2" }
meerkat-tools = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2" }
meerkat-models = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2" }
meerkat-llm-core = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2" }
meerkat-memory = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2" }
meerkat-sandbox = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2" }
meerkat-mob = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2", optional = true }
meerkat-mob-mcp = { git = "https://github.com/zond/meerkat.git", rev = "75a37e9e3b81e9a5007ae07158d8d4edd2e8e4f2", optional = true }

# Async + serialization
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
toml = "0.9"
schemars = { version = "1", features = ["derive"] }

# Infra
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Durable digests (allow cache, trust record) and atomic file writes.
sha2 = "0.10"
tempfile = "3.14"

# Terminal UI
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

# File tools and path policy
ignore = "0.4"
globset = "0.4"
regex = "1"
similar = "2"

# Ctrl+Z: stop the process with SIGTSTP (job control).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs", "user"] }

[features]
default = ["mcp", "mob"]
mcp = ["meerkat/mcp"]
# Sub-agents run as mob members (`delegate` / `fork_off`).
mob = ["dep:meerkat-mob", "dep:meerkat-mob-mcp"]
# Makes the internal modules public and adds `harness` (the headless
# runner) for this crate's own integration tests. Not a stable API.
test-support = []

[dev-dependencies]
# The integration tests drive the internal modules through `test-support`.
rkat-tui = { path = ".", features = ["test-support"] }
tokio = { version = "1.43", features = ["full", "test-util", "macros"] }
tempfile = "3.14"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(meerkat_internal_agent_factory_build)", "cfg(meerkat_internal_generated_authority_bridge)"] }

[workspace.lints.clippy]
# ── Lint groups (pedantic is the main "paranoid" level) ──────────────
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# ── Hard denies (these are bugs, not style) ─────────────────────────
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
mutex_integer = "deny"
mutex_atomic = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "allow"
print_stderr = "allow"

# ── Pedantic allows (noisy or inapplicable) ─────────────────────────
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
return_self_not_must_use = "allow"
manual_string_new = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
missing_fields_in_debug = "allow"
unreadable_literal = "allow"
float_cmp = "allow"
single_match_else = "allow"
similar_names = "allow"
doc_markdown = "allow"
match_bool = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
needless_pass_by_value = "allow"
needless_continue = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
struct_field_names = "allow"
doc_link_with_quotes = "allow"
missing_const_for_fn = "allow"
default_trait_access = "allow"
let_underscore_untyped = "allow"
allow_attributes_without_reason = "allow"
ignore_without_reason = "allow"
manual_let_else = "allow"
unused_async = "allow"
assigning_clones = "allow"
format_push_string = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
map_unwrap_or = "allow"
case_sensitive_file_extension_comparisons = "allow"
ref_option = "allow"
items_after_test_module = "allow"
large_futures = "allow"
large_enum_variant = "allow"
redundant_closure_for_method_calls = "allow"
question_mark = "allow"
type_complexity = "allow"
# Cargo
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
redundant_feature_names = "allow"

