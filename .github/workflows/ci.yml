name: CI
on:
  push:
    branches: [main]
  pull_request:

# The gate from CLAUDE.md, split in two so the lint and the test builds run
# side by side: on the two-core hosted runner each compilation of the crate
# and its engine takes the better part of an hour, and one job doing both
# overran its 90 minutes before any test ran. Each job caches its own target.
env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # The runner has about 14 GB free. The --all-features test build with
  # incremental compilation and full debug info does not fit (earlier runs
  # ended with "Free space left: 0 MB" and the linker killed by a bus error).
  # Neither helps CI: nothing is rebuilt here and backtraces keep their line
  # tables.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Preinstalled toolsets this build never uses; removing them frees
      # roughly 25 GB.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Default features, no test-support: the internal modules are
      # crate-private here, so an unused item is reported as dead code.
      - run: cargo clippy --lib --bins -- -D warnings
      # Broken intra-doc links. The rustdoc is for maintainers, so private
      # items are documented and links to them are fine (rustdoc allows
      # that lint in this mode by default; -D warnings would re-deny it).
      - run: RUSTDOCFLAGS="-D warnings -A rustdoc::private_intra_doc_links" cargo doc --no-deps --all-features --document-private-items

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --all-features
