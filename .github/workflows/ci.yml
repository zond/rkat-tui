name: CI
on:
  push:
    branches: [main]
  pull_request:

# The gate from CLAUDE.md, split in two so the lint and the test builds run
# side by side: on the two-core hosted runner each compilation of the crate
# and its engine takes the better part of an hour, and one job doing both
# overran its 90 minutes before any test ran. Each job caches its own target.
env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # The runner has about 14 GB free. The --all-features test build with
  # incremental compilation and full debug info does not fit (earlier runs
  # ended with "Free space left: 0 MB" and the linker killed by a bus error).
  # Neither helps CI: nothing is rebuilt here and backtraces keep their line
  # tables.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Preinstalled toolsets this build never uses; removing them frees
      # roughly 25 GB.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Default features, no test-support: the internal modules are
      # crate-private here, so an unused item is reported as dead code.
      - run: cargo clippy --lib --bins -- -D warnings
      # Broken intra-doc links. The rustdoc is for maintainers, so private
      # items are documented and links to them are fine (rustdoc allows
      # that lint in this mode by default; -D warnings would re-deny it).
      - run: RUSTDOCFLAGS="-D warnings -A rustdoc::private_intra_doc_links" cargo doc --no-deps --all-features --document-private-items

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The tests must not write into the user's state directory (where
      # the daemon's endpoint files live): point it at an empty one and
      # fail the job if anything is left in it.
      # The sandbox rows (tests/it/confinement.rs, tests/it/daemon.rs) need
      # unprivileged user namespaces, which the runner's AppArmor
      # restricts: lift that for this job, and make a skip a failure, so a
      # runner that cannot confine fails instead of passing by skipping.
      # The ~/.ssh row needs a directory to hide.
      - name: Let the sandbox run
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "RKAT_TUI_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      - name: An empty state directory
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/state" >> "$GITHUB_ENV"
      - run: cargo nextest run --all-features
      - name: The tests left nothing in the state directory
        run: |
          left=$(find "$XDG_STATE_HOME" -mindepth 1)
          if [ -n "$left" ]; then
            echo "the tests left files in XDG_STATE_HOME:"
            echo "$left"
            exit 1
          fi

  # Recommendation 10 of the security review: advisories, licences and
  # sources (deny.toml). Not part of the local gate; docs/testing.md says
  # how to run it.
  # The repository is mirrored into a host whose secret scanner (gitleaks)
  # refuses a commit that adds a value looking like a credential, a fake
  # one in test data included. Scan the tree and every commit after the
  # one before this job was added (older commits hold two such values).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The same mirror refuses a file over 1 MB and a file named like a
      # shell history.
      - name: No large file, no history-named file
        run: |
          bad=$(git ls-files -z | xargs -0 -r stat -c '%s %n' | awk '$1 > 700000')
          named=$(git ls-files | grep -E '(^|/)\.?[A-Za-z0-9-]*_history$' || true)
          if [ -n "$bad$named" ]; then
            echo "tracked files the mirror refuses (over 700 kB, or named *_history):"
            echo "$bad"; echo "$named"
            exit 1
          fi
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --verbose'
      - run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact --verbose --log-opts="a646192c200c5e8e44b2ce630270b7c0e2640d02..HEAD"'

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
