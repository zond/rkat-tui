name: CI
on:
  push:
    branches: [main]
  pull_request:

# The gate from CLAUDE.md, split in two so the lint and the test builds run
# side by side: on the two-core hosted runner each compilation of the crate
# and its engine takes the better part of an hour, and one job doing both
# overran its 90 minutes before any test ran. Each job caches its own target.
env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # The runner has about 14 GB free. The --all-features test build with
  # incremental compilation and full debug info does not fit (earlier runs
  # ended with "Free space left: 0 MB" and the linker killed by a bus error).
  # Neither helps CI: nothing is rebuilt here and backtraces keep their line
  # tables.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Preinstalled toolsets this build never uses; removing them frees
      # roughly 25 GB.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Default features, no test-support: the internal modules are
      # crate-private here, so an unused item is reported as dead code.
      - run: cargo clippy --lib --bins -- -D warnings
      # Broken intra-doc links. The rustdoc is for maintainers, so private
      # items are documented and links to them are fine (rustdoc allows
      # that lint in this mode by default; -D warnings would re-deny it).
      - run: RUSTDOCFLAGS="-D warnings -A rustdoc::private_intra_doc_links" cargo doc --no-deps --all-features --document-private-items

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The tests must not write into the user's state directory (where
      # the daemon's endpoint files live): point it at an empty one and
      # fail the job if anything is left in it.
      # The sandbox rows (tests/it/confinement.rs, tests/it/daemon.rs) need
      # unprivileged user namespaces, which the runner's AppArmor
      # restricts: lift that for this job, and make a skip a failure, so a
      # runner that cannot confine fails instead of passing by skipping.
      # The ~/.ssh row needs a directory to hide.
      - name: Let the sandbox run
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "RKAT_TUI_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      - name: An empty state directory
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/state" >> "$GITHUB_ENV"
      - run: cargo nextest run --all-features
      - name: The tests left nothing in the state directory
        run: |
          left=$(find "$XDG_STATE_HOME" -mindepth 1)
          if [ -n "$left" ]; then
            echo "the tests left files in XDG_STATE_HOME:"
            echo "$left"
            exit 1
          fi

  # Recommendation 10 of the security review: advisories, licences and
  # sources (deny.toml). Not part of the local gate; docs/testing.md says
  # how to run it.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
